name: Discord Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: discord-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Pull latest data from git
        run: |
          git pull origin main || git pull origin master || echo "No remote changes"

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 g++ make libsqlite3-dev pkg-config

      - name: Install project dependencies
        run: |
          npm ci || npm install
          npm install better-sqlite3@latest --build-from-source || true
          npm rebuild --build-from-source

      - name: Kill previous bot process if running
        run: |
          BOT_PID=$(pgrep -f "node index.js") || true
          if [ ! -z "$BOT_PID" ]; then
            echo "Killing previous bot process: $BOT_PID"
            kill -9 $BOT_PID
          fi

      - name: Create .env file from secrets
        run: |
          echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" > .env
          echo "CLIENT_ID=${{ secrets.CLIENT_ID }}" >> .env
          echo "WEATHERAPI_KEY=${{ secrets.WEATHERAPI_KEY }}" >> .env
          echo "REMOVEBG_API_KEY=${{ secrets.REMOVEBG_API_KEY }}" >> .env

      - name: Start bot with periodic database backup
        timeout-minutes: 355
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          node index.js &
          BOT_PID=$!
          echo "Bot started with PID: $BOT_PID"
          
          save_databases() {
            echo "Saving databases..."
            git add data/*.sqlite data/*.db data/*.sqlite-wal data/*.sqlite-shm 2>/dev/null || true
            git add data/ 2>/dev/null || true
            
            if ! git diff --staged --quiet 2>/dev/null; then
              git commit -m "chore: auto-save databases [skip ci]" 2>/dev/null || true
              
              for i in 1 2 3; do
                if git push 2>/dev/null; then
                  echo "Databases saved successfully"
                  break
                else
                  echo "Push failed, retrying ($i/3)..."
                  git pull --rebase origin main 2>/dev/null || git pull --rebase origin master 2>/dev/null || true
                  sleep 2
                fi
              done
            else
              echo "No database changes to save"
            fi
          }
          
          COUNTER=0
          while kill -0 $BOT_PID 2>/dev/null; do
            sleep 300
            COUNTER=$((COUNTER + 1))
            
            if [ $((COUNTER % 6)) -eq 0 ]; then
              save_databases
            fi
            
            if [ $COUNTER -ge 70 ]; then
              echo "Approaching timeout, saving and stopping bot..."
              save_databases
              kill $BOT_PID
              break
            fi
          done
          
          echo "Bot stopped, performing final save..."
          save_databases
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          REMOVEBG_API_KEY: ${{ secrets.REMOVEBG_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Final database backup
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/*.sqlite data/*.db data/*.sqlite-wal data/*.sqlite-shm || true
          git add data/ || true
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: final database backup [skip ci]" || true
            git push || echo "Final push failed, but periodic saves should have worked"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}