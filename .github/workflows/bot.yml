name: Discord Bot

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours at minute 0
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: discord-bot
  cancel-in-progress: false  # we handle stopping manually

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # -----------------------
      # RESTORE DATA FROM GIT
      # -----------------------
      - name: Pull latest data from git
        run: |
          git pull origin main || git pull origin master || echo "No remote changes"

      - name: Ensure data directory exists
        run: mkdir -p data

      # -----------------------
      # NODE MODULES CACHE (separate from data)
      # -----------------------
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies (for native builds)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 g++ make libsqlite3-dev pkg-config

      - name: Install project dependencies
        run: |
          npm ci || npm install
          npm install better-sqlite3@latest --build-from-source || true
          npm rebuild --build-from-source

      - name: Kill previous bot process if running
        run: |
          BOT_PID=$(pgrep -f "node index.js") || true
          if [ ! -z "$BOT_PID" ]; then
            echo "Killing previous bot process: $BOT_PID"
            kill -9 $BOT_PID
          fi

      - name: Create .env file from secrets
        run: |
          echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" > .env
          echo "CLIENT_ID=${{ secrets.CLIENT_ID }}" >> .env
          echo "WEATHERAPI_KEY=${{ secrets.WEATHERAPI_KEY }}" >> .env
          echo "REMOVEBG_API_KEY=${{ secrets.REMOVEBG_API_KEY }}" >> .env

      - name: Start bot
        run: node index.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          REMOVEBG_API_KEY: ${{ secrets.REMOVEBG_API_KEY }}

      # -----------------------
      # PERSIST DATA TO GIT
      # -----------------------
      - name: Persist databases to git
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all database files
          git add data/*.sqlite data/*.db data/*.sqlite-wal data/*.sqlite-shm || true
          git add data/ || true
          
          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No database changes to commit"
          else
            git commit -m "chore: persist sqlite databases [skip ci]"
            
            # Retry push up to 3 times in case of conflicts
            for i in 1 2 3; do
              if git push; then
                echo "Successfully pushed database changes"
                break
              else
                echo "Push failed, attempt $i/3"
                git pull --rebase origin main || git pull --rebase origin master || true
                sleep 2
              fi
            done
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}